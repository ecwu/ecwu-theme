# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "ECWU Theme"
license = "MIT"
licenselink = "https://github.com/ecwu/ecwu-theme/blob/main/LICENSE"
description = "A clean, responsive Hugo theme for blogs and photography portfolios"
homepage = "https://github.com/ecwu/ecwu-theme"
tags = [
  'responsive',
  'clean',
  'light',
  'dark',
  'minimalist',
  'blog'
]
features = [
  'responsive',
  'blog',
  'table-of-contents',
  'archive',
  'cover',
  'social-icons',
]
min_version = "0.160.0"

[author]
  name = "Zhenghao Wu"
  homepage = "https://ecwuuuuu.com/"
