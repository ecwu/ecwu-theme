{{ if and hugo.IsProduction .Params.enablecomment }}
{{ with .Site.Params.giscus }}
<section class="pb-10 w-content" aria-labelledby="comments-title">
  <h2 id="comments-title" class="sr-only">Comments</h2>
  <script src="https://giscus.app/client.js"
          data-repo="{{ .repo }}"
          data-repo-id="{{ .repoid }}"
          data-category="{{ .category }}"
          data-category-id="{{ .categoryid }}"
          data-mapping="{{ .mapping | default "pathname" }}"
          data-reactions-enabled="{{ .reactionsenabled | default "1" }}"
          data-emit-metadata="{{ .emitmetadata | default "0" }}"
          data-input-position="{{ .inputposition | default "bottom" }}"
          data-theme="{{ .theme | default "preferred_color_scheme" }}"
          data-lang="{{ .lang | default "en" }}"
          data-loading="{{ .loading | default "lazy" }}"
          crossorigin="anonymous"
          async>
  </script>
</section>
{{ end }}
{{ else if .Params.enablecomment }}
<div class="bg-gray-300 bg-stripes bg-stripes-white dark:text-gray-400 dark:bg-slate-700 dark:bg-stripes-slate-900 rounded-md w-[55%] my-5 py-3 text-center" role="status">
<span class="text-primary">
Comment section disabled outside production
</span>
</div>
{{ end }}
