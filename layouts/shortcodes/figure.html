
<figure class="w-full">
  {{ $alt := .Get "alt" | default (.Get "caption") | default (.Get "title") | default "" }}
  <img src="{{ .Get "src" }}" alt="{{ $alt }}" class="rounded-lg" loading="lazy" decoding="async">

  <figcaption>
  {{ with .Get "title"}}<strong>{{ . }} </strong>{{ end}}
  {{ with .Get "caption"}}{{ . }}{{ end }}
  {{ with .Get "attrlink"}}<a href="{{ .}}">{{ end }}
  {{ with .Get "attr" }}{{ . }}{{ end }}
  {{ if .Get "attrlink" }}</a>{{ end }}
  </figcaption>
</figure>
