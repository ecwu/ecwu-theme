{{ $loc := .Get 0  }}
{{ if .IsNamedParams }}
  {{ $layoutClass := partial "shortcodes/layout-class.html" (dict "ctx" . "default_classes" "") }}
  <section {{ if ne $layoutClass "" }}class="{{ $layoutClass }}"{{ end }}{{with .Get "id"}} id="{{.}}"{{end}}>
{{ else if or (eq $loc "") (eq $loc "begin") }}
  <section>
{{ else if eq $loc "end" }}
  </section>
{{ end }}
